name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type-check
        run: npm run typecheck

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-garden-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Publish the APK at a stable public URL so Neurolia can download it:
      # https://github.com/jawadstalker/Qrn/releases/latest/download/quran-garden.apk
      - name: Publish APK to the 'latest' release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" quran-garden.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest quran-garden.apk \
            --title "Quran Garden (latest)" \
            --notes "Automatic build from commit ${GITHUB_SHA}" \
            --target "${GITHUB_SHA}"