<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>باغ قرآن — دانلود</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f8f5; --fg:#10241c; --card:#fff; --accent:#2F6B4F; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0C1A16; --fg:#e8f1ec; --card:#13271f; --accent:#4aa37b; } }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:Tahoma,system-ui,sans-serif; line-height:1.9; }
  main { max-width:520px; margin:0 auto; padding:48px 16px; }
  .card { background:var(--card); border-radius:16px; padding:28px 20px; text-align:center; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  img { width:96px; height:96px; border-radius:22px; }
  h1 { margin:12px 0 4px; font-size:1.5rem; }
  p { margin:8px 0; }
  .btn { display:inline-block; margin-top:16px; padding:12px 28px; background:var(--accent); color:#fff; border-radius:12px; text-decoration:none; font-weight:bold; }
  small { opacity:.7; display:block; margin-top:16px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <img src="icon.png" alt="" onerror="this.style.display='none'">
    <h1>باغ قرآن</h1>
    <p>حفظ قرآن با گیاهی که همراه شما رشد می‌کند.</p>
    <a class="btn" href="quran-garden.apk" download>دانلود برای اندروید (APK)</a>
    <small>برای نصب، اجازهٔ «نصب از منابع ناشناس» را در تنظیمات گوشی فعال کنید.</small>
  </div>
</main>
</body>
</html>
